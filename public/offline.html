<!doctype html>
<!--
  Pantalla de "sin conexión" del service worker (public/sw.js), para cualquier página que no sea
  la bóveda (que abre sin señal con lo guardado). Es HTML plano y no una ruta de Next a propósito:
  se sirve en respuesta a otra URL, y una página de Next hidrataría con datos que no son los de la
  barra de direcciones y terminaría en el error de Next. Los colores son los de globals.css
  (concrete, kraft, marker, tape), copiados: si cambian ahí, cambian acá.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4935c" />
    <title>Sin conexión · The Vault</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #d9dad6;
        color: #1c1b19;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        overflow: hidden;
        border-radius: 8px;
        background: #f7f6f2;
        box-shadow: 0 18px 40px -18px rgb(28 27 25 / 55%);
      }
      .lid { height: 12px; background: #c4935c; border-bottom: 2px solid #8a6238; }
      .body { padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      .tape { display: inline-block; transform: rotate(-2deg); background: #e8dcb4; padding: 0 10px; }
      p { margin: 0 0 6px; color: #57534c; }
      button {
        margin-top: 16px;
        height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #1c1b19;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lid" aria-hidden="true"></div>
      <div class="body">
        <h1><span class="tape">Sin conexión</span></h1>
        <p>Esta página necesita internet. Tu bóveda sí abre sin señal: andá a la página principal.</p>
        <p lang="en">Offline. This page needs the internet; your vault opens without it from the home page.</p>
        <button type="button" onclick="location.href = '/'">Ir a la bóveda</button>
      </div>
    </main>
  </body>
</html>
